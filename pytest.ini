[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -ra
    --cov=app
    --cov-report=term-missing
    --cov-fail-under=85
markers =
    integration: tests that exercise FastAPI with PostgreSQL
    e2e: end-to-end API flows
